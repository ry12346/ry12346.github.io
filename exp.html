<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3443">
<title>経験値・資料 | 真戦データ帳</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231f3443%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2736%27 text-anchor=%27middle%27 fill=%27%23f2d9a8%27 font-weight=%27900%27%3E%E7%9C%9F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <div class="eyebrow">REFERENCE</div>
    <h1>経験値・資料</h1>
    <p>部隊の戦法（1武将3つ、最大9個）を上げるのに必要な戦法経験と、武将心得の必要枚数。<span class="badge-warn">要検証</span> の付いた値はゲーム内で未確認です。</p>
  </div>

  <section class="card">
    <h2 style="margin:0 0 10px;font-size:18px">部隊の戦法経験値計算</h2>
    <div class="table-wrap" style="max-height:none">
      <table class="data calc-table" id="calc">
        <thead><tr>
          <th>品質</th><th class="num">個数</th><th>現在Lv → 目標Lv</th>
          <th class="num">1個あたり</th><th class="num">小計</th><th class="num">★4心得</th><th class="num">★3心得</th>
        </tr></thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>
    <p class="note" id="count-warn" hidden></p>
    <div class="calc-opts">
      <div id="shop"></div>
      <label class="toggle"><input type="checkbox" id="koban"> 武将心得を小判で2倍にして変換する</label>
    </div>
    <div class="result" id="result"></div>
  </section>

  <h2 class="section-title">必要経験値表 <span id="exp-badge"></span></h2>
  <section class="card">
    <div class="table-wrap" style="max-height:none">
      <table class="data" id="exp-table"><thead></thead><tbody></tbody></table>
    </div>
    <p class="note" id="exp-note"></p>
  </section>

  <h2 class="section-title">その他の資料</h2>
  <div class="grid2" id="others"></div>
</main>

<script type="module">
import { $, esc, loadJSON } from "./assets/site.js";

const ref = await loadJSON("reference.json");
const GRADES = Object.keys(ref.tacticExp).filter((g) => ref.tacticExp[g].toNext.length);
const MAX = ref.maxTactics;
const per = ref.kokoroe.expPerCard; // { 星4: 40, 星3: 20 }
const badge = (v) => (v ? "" : ' <span class="badge-warn">要検証</span>');
const n = (v) => v.toLocaleString();
const expBetween = (g, from, to) => ref.tacticExp[g].toNext.slice(from - 1, Math.max(from - 1, to - 1)).reduce((a, b) => a + b, 0);
const lvOpts = (value) => Array.from({ length: 10 }, (_, i) => `<option ${i + 1 === value ? "selected" : ""}>${i + 1}</option>`).join("");

// ---- 入力行（品質ごと）
const DEFAULT_COUNT = { S: MAX, A: 0, B: 0 };
$("#calc tbody").innerHTML = GRADES.map((g) => `
  <tr data-g="${g}">
    <td><span class="grade" data-g="${g}">${g}</span></td>
    <td class="num"><input type="number" class="cnt" min="0" max="${MAX}" value="${DEFAULT_COUNT[g] ?? 0}"></td>
    <td><select class="from">${lvOpts(1)}</select> → <select class="to">${lvOpts(10)}</select></td>
    <td class="num one"></td><td class="num sub"></td><td class="num k4"></td><td class="num k3"></td>
  </tr>`).join("");

$("#shop").innerHTML = ref.shop.items.map((it, i) => `
  <label class="toggle"><input type="checkbox" class="shop" data-i="${i}" ${it.default ? "checked" : ""}> ${esc(it.label)}（${n(it.exp)}）を差し引く</label>`).join("");

function calc() {
  const mul = $("#koban").checked ? 2 : 1;
  const cards = (exp, k) => Math.ceil(exp / (per[k] * mul));
  let total = 0, count = 0;
  for (const tr of $("#calc tbody").children) {
    const g = tr.dataset.g;
    const c = Math.max(0, Math.min(MAX, +tr.querySelector(".cnt").value || 0));
    const one = expBetween(g, +tr.querySelector(".from").value, +tr.querySelector(".to").value);
    const sub = one * c;
    total += sub;
    count += c;
    tr.querySelector(".one").textContent = n(one);
    tr.querySelector(".sub").textContent = n(sub);
    tr.querySelector(".k4").textContent = n(cards(sub, "星4"));
    tr.querySelector(".k3").textContent = n(cards(sub, "星3"));
  }
  $("#calc tfoot").innerHTML = `<tr><td><b>合計</b></td><td class="num"><b>${count}</b></td><td></td><td></td>
    <td class="num"><b>${n(total)}</b></td><td class="num"><b>${n(cards(total, "星4"))}</b></td><td class="num"><b>${n(cards(total, "星3"))}</b></td></tr>`;

  const warn = $("#count-warn");
  warn.hidden = count <= MAX;
  warn.innerHTML = `<span class="badge-warn">注意</span> 個数の合計が ${count} 個です（部隊の戦法は最大 ${MAX} 個）。`;

  const shop = [...document.querySelectorAll(".shop")].filter((x) => x.checked).map((x) => ref.shop.items[+x.dataset.i]);
  const shopExp = shop.reduce((a, it) => a + it.exp, 0);
  const rest = Math.max(0, total - shopExp);
  $("#result").innerHTML = `
    <div class="small muted">必要な戦法経験 ${n(total)}${shop.map((it) => ` − ${esc(it.label)} ${n(it.exp)}`).join("")}</div>
    <div class="big">${n(rest)}</div>
    <ul>
      <li>★4の武将心得なら <b>${n(cards(rest, "星4"))}</b> 枚（1枚 ${per["星4"] * mul}）</li>
      <li>★3の武将心得なら <b>${n(cards(rest, "星3"))}</b> 枚（1枚 ${per["星3"] * mul}）</li>
    </ul>
    ${total < shopExp ? `<p class="small muted" style="margin:6px 0 0">商店の分だけで足ります（${n(shopExp - total)} 余り）。</p>` : ""}
    <p class="small muted" style="margin:6px 0 0">品質ごとの心得枚数は商店分を差し引く前の値です。心得の換算${badge(ref.kokoroe.verified)}</p>`;
}
document.addEventListener("input", (e) => { if (e.target.closest("#calc, .calc-opts")) calc(); });
document.addEventListener("change", (e) => { if (e.target.closest("#calc, .calc-opts")) calc(); });
calc();

// ---- 必要経験値表（品質を横に並べる）
$("#exp-table thead").innerHTML = `<tr><th>レベル</th>${GRADES.map((g) => `<th class="num">${g} 必要</th><th class="num">${g} 累計</th>`).join("")}</tr>`;
const sums = Object.fromEntries(GRADES.map((g) => [g, 0]));
$("#exp-table tbody").innerHTML = ref.tacticExp.S.toNext.map((_, i) => `<tr><td>Lv${i + 1} → ${i + 2}</td>${GRADES.map((g) => {
  const v = ref.tacticExp[g].toNext[i];
  sums[g] += v;
  return `<td class="num">${n(v)}</td><td class="num">${n(sums[g])}</td>`;
}).join("")}</tr>`).join("");
$("#exp-badge").innerHTML = badge(GRADES.every((g) => ref.tacticExp[g].verified));
$("#exp-note").textContent = GRADES.every((g) => ref.tacticExp[g].verified) ? "S・A・Bともゲーム内の値と一致を確認済み。" : GRADES.map((g) => `${g}：${ref.tacticExp[g].note}`).join(" ");

// ---- その他の資料
const k = ref.kokoroe, c = ref.itemCooldown;
$("#others").innerHTML = `
  <section class="card">
    <h2 style="margin:0 0 6px;font-size:16px">武将心得${badge(k.verified)}</h2>
    <p class="small muted" style="margin:0 0 8px">${esc(k.note)}</p>
    <table class="mini"><tbody>
      ${Object.entries(k.expPerCard).map(([a, b]) => `<tr><td>${esc(a)} 1枚の戦法経験</td><td>${b}</td></tr>`).join("")}
      ${Object.entries(k.maxStack).map(([a, b]) => `<tr><td>所持上限：${esc(a)}</td><td>${b}</td></tr>`).join("")}
    </tbody></table>
  </section>
  <section class="card">
    <h2 style="margin:0 0 6px;font-size:16px">盟約の品 待機時間${badge(c.verified)}</h2>
    <p class="small muted" style="margin:0 0 8px">${esc(c.note)}</p>
    <table class="mini"><tbody>${c.rows.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${b ? esc(b) : '<span class="na">未収録</span>'}</td></tr>`).join("")}</tbody></table>
  </section>`;
</script>
</body>
</html>
