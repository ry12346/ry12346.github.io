<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3443">
<title>武将一覧 | 真戦データ帳</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231f3443%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2736%27 text-anchor=%27middle%27 fill=%27%23f2d9a8%27 font-weight=%27900%27%3E%E7%9C%9F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <div class="eyebrow">GENERALS</div>
    <h1>武将一覧</h1>
    <p>Lv1の値と、1レベルごとの上昇値（成長値）。レベルを指定すると、その時点の素の値（属性ポイント振り分け・兵学・装備などは含まない）を表示します。行をタップすると詳細を表示します。</p>
  </div>

  <div class="card filters">
    <div class="frow"><input class="search" id="q" type="search" placeholder="武将名・よみ・固有戦法で検索" autocomplete="off"></div>
    <div class="frow" id="f-faction"><label>勢力</label></div>
    <div class="frow" id="f-star"><label>レア度</label></div>
    <div class="frow" id="f-cost"><label>コスト</label></div>
  </div>

  <div class="toolbar">
    <div class="seg" id="mode">
      <button type="button" data-mode="lv1" aria-pressed="true">Lv1＋成長値</button>
      <button type="button" data-mode="lv" aria-pressed="false">レベル指定</button>
    </div>
    <div class="lv-ctl" id="lv-ctl" hidden>
      <span>Lv</span>
      <input type="range" id="lv" min="1" max="50" value="50">
      <output id="lv-out">50</output>
    </div>
    <span class="count" id="count"></span>
  </div>

  <div class="table-wrap">
    <table class="data" id="tbl">
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <p class="note">成長値は1レベル上がるごとの上昇量です。Lv N の値 ＝ Lv1 ＋ 成長値 ×（N − 1）。「Lv50のみ」の武将はLv1・成長値が未収録で、灰色の数字はLv50の値です。ステータスが「—」の武将は未収録です。</p>
</main>

<dialog id="dlg"></dialog>

<script type="module">
import { $, esc, fold, loadJSON, chipGroup, FACTIONS } from "./assets/site.js";

const STATS = [["bu", "武勇"], ["chi", "知略"], ["tou", "統率"], ["spd", "速度"], ["sei", "政務"], ["mi", "魅力"]];
const [heroes, skills, adjustments, formations] = await Promise.all([
  loadJSON("heroes.json"), loadJSON("skills.json"),
  loadJSON("adjustments.json").catch(() => ({})), loadJSON("formations.json").catch(() => ({ 編制: [], 出典: [] })),
]);
const skillByName = new Map(skills.map((s) => [s.name, s]));
const sources = new Map(formations.出典.map((x) => [x.id, x]));

// 公式のおすすめ編制で、その武将が使っている戦法と編制の一覧
const L = (x) => x || [];
function recommendFor(name) {
  const uses = [];
  for (const f of formations.編制) {
    const m = f.武将.find((x) => x.武将 === name);
    if (m) uses.push({ f, m, mates: f.武将.filter((x) => x !== m).map((x) => x.武将) });
  }
  const count = new Map();
  for (const { m } of uses) {
    for (const t of [...L(m.第一), ...L(m.第二), ...L(m.推奨)]) count.set(t, (count.get(t) || 0) + 1);
  }
  const altCount = new Map();
  for (const { m } of uses) {
    for (const t of [...L(m.代替第一), ...L(m.代替第二)]) altCount.set(t, (altCount.get(t) || 0) + 1);
  }
  const sort = (mp) => [...mp].sort((a, b) => b[1] - a[1]);
  // 新武将徹底解説の「推奨戦法」と「評価」（新しい記事から）
  const notes = L(formations.武将解説).filter((x) => x.武将 === name)
    .sort((a, b) => String(sources.get(b.出典)?.date).localeCompare(String(sources.get(a.出典)?.date)));
  return { uses, notes, top: sort(count), alt: sort(altCount) };
}
const tacticLink = (t) => {
  const s = skillByName.get(t);
  return `<a class="rec-tac" href="tactics.html?q=${encodeURIComponent(t)}">${s ? `<b class="g" data-g="${esc(s.grade)}">${esc(s.grade)}</b>` : ""}${esc(t)}</a>`;
};
const skillById = new Map(skills.map((s) => [s.id, s]));
for (const h of heroes) {
  h._q = fold([h.name, h.kana, h.uniqueSkill, h.family].join(" "));
}

let mode = "lv1";
let level = 50;
let sortKey = null;
let sortDir = -1;

// h.stats = {key: [Lv1, 成長値]}。Lv1・成長値が未収録の武将は h.lv50 = {key: Lv50の値} だけを持つ
const valueAt = (h, k, lv) => {
  if (h.stats?.[k]) return h.stats[k][0] + h.stats[k][1] * (lv - 1);
  if (h.lv50 && lv === 50) return h.lv50[k];
  return null;
};
const totalAt = (h, lv) => (h.stats || (h.lv50 && lv === 50) ? STATS.reduce((a, [k]) => a + (valueAt(h, k, lv) ?? 0), 0) : null);
const shownLv = () => (mode === "lv1" ? 1 : level);

const COLS = [
  { key: "name", label: "武将", cls: "name", get: (h) => h.kana || h.name },
  { key: "star", label: "★", cls: "num", get: (h) => h.star },
  { key: "faction", label: "勢力", get: (h) => FACTIONS.indexOf(h.faction) },
  { key: "cost", label: "コスト", cls: "num", get: (h) => h.cost },
  ...STATS.map(([k, label]) => ({ key: k, label, cls: "num", get: (h) => valueAt(h, k, shownLv()) })),
  { key: "total", label: "合計", cls: "num", get: (h) => totalAt(h, shownLv()) },
  { key: "unique", label: "固有戦法", get: (h) => h.uniqueSkill },
  { key: "troop", label: "兵種ボーナス", get: (h) => h.troopBonus.map((t) => t.troop).join() },
];

const factionF = chipGroup($("#f-faction"), FACTIONS, render);
const starF = chipGroup($("#f-star"), [5, 4], render, { label: (v) => "★" + v });
const costF = chipGroup($("#f-cost"), [7, 6, 5, 4, 3], render);
$("#q").addEventListener("input", render);

$("#mode").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  mode = b.dataset.mode;
  for (const x of $("#mode").children) x.setAttribute("aria-pressed", x === b);
  $("#lv-ctl").hidden = mode !== "lv";
  render();
});
$("#lv").addEventListener("input", (e) => {
  level = +e.target.value;
  $("#lv-out").textContent = level;
  render();
});

const thead = $("#tbl thead tr");
thead.innerHTML = COLS.map((c) => `<th class="${c.cls || ""}" data-k="${c.key}">${c.label}</th>`).join("");
thead.addEventListener("click", (e) => {
  const th = e.target.closest("th");
  if (!th) return;
  const k = th.dataset.k;
  if (sortKey === k) sortDir = -sortDir;
  else { sortKey = k; sortDir = ["name", "faction", "unique", "troop"].includes(k) ? 1 : -1; }
  for (const x of thead.children) x.removeAttribute("aria-sort");
  th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending");
  render();
});

function fmt(v, digits = 0) {
  return v == null ? '<span class="na">—</span>' : v.toFixed(digits);
}

function statCell(h, k) {
  if (!h.stats?.[k] && h.lv50 && mode === "lv1") return `<td class="num"><span class="lv50only" title="Lv50の値（Lv1・成長値は未収録）">${h.lv50[k]}</span></td>`;
  if (!h.stats?.[k] && h.lv50 && level === 50) return `<td class="num">${h.lv50[k]}</td>`;
  if (!h.stats?.[k]) return `<td class="num"><span class="na">—</span></td>`;
  const [base, g] = h.stats[k];
  if (mode === "lv1") return `<td class="num">${fmt(base)}<span class="growth">+${g.toFixed(2)}</span></td>`;
  return `<td class="num">${fmt(valueAt(h, k, level), 1)}</td>`;
}

function render() {
  const q = fold($("#q").value);
  let rows = heroes.filter((h) => factionF.test(h.faction) && starF.test(h.star) && costF.test(h.cost) && (!q || h._q.includes(q)));
  if (sortKey) {
    const col = COLS.find((c) => c.key === sortKey);
    rows = rows.slice().sort((a, b) => {
      const x = col.get(a), y = col.get(b);
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y, "ja") : x - y) * sortDir;
    });
  }
  $("#count").textContent = `${rows.length} / ${heroes.length} 名`;
  $("#tbl tbody").innerHTML = rows.length
    ? rows.map((h) => `
      <tr data-id="${h.id}">
        <td class="name">${esc(h.name)}${h.limited ? ` <span class="badge-lim">${esc(h.limited)}</span>` : ""}${h.lv50 ? ' <span class="badge-lv50">Lv50のみ</span>' : ""}${h.kana ? `<span class="kana">${esc(h.kana)}</span>` : ""}</td>
        <td class="num"><span class="stars">${"★".repeat(h.star)}</span></td>
        <td><span class="fac" data-f="${esc(h.faction)}">${esc(h.faction)}</span></td>
        <td class="num">${h.cost}</td>
        ${STATS.map(([k]) => statCell(h, k)).join("")}
        <td class="num">${mode === "lv1" ? (h.lv50 ? `<span class="lv50only">${totalAt(h, 50)}</span>` : fmt(totalAt(h, 1))) : fmt(totalAt(h, level), h.lv50 ? 0 : 1)}</td>
        <td>${esc(h.uniqueSkill)}</td>
        <td>${esc(h.troopBonus.map((t) => t.troop + t.value).join(" "))}</td>
      </tr>`).join("")
    : `<tr><td colspan="${COLS.length}" class="empty">該当する武将がいません</td></tr>`;
}

$("#tbl tbody").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (tr) openDetail(heroes.find((h) => h.id === +tr.dataset.id));
});

function openDetail(h) {
  const s = skillById.get(h.uniqueSkillId);
  const dlg = $("#dlg");
  dlg.innerHTML = `
    <div class="dlg-head">
      <button class="dlg-close" aria-label="閉じる">✕</button>
      <span class="kana">${esc(h.kana)}</span>
      <h2>${esc(h.name)}</h2>
      <div class="kv">
        <span>${"★".repeat(h.star)}</span><span>${esc(h.faction)}</span><span>${esc(h.family)}</span><span>コスト ${h.cost}</span>
        ${h.troopBonus.map((t) => `<span>${esc(t.troop)} ${esc(t.value)}</span>`).join("")}
      </div>
    </div>
    <div class="dlg-body">
      <section>
        <h3>ステータス${h.statsOfficial ? ' <span class="tag ok" style="font-size:10px;vertical-align:middle">公式発表</span>' : ""}</h3>
        ${h.stats ? `
        <table class="mini">
          <thead><tr><th>属性</th><th>Lv1</th><th>成長値</th><th>Lv20</th><th>Lv40</th><th>Lv50</th></tr></thead>
          <tbody>
            ${STATS.map(([k, label]) => h.stats[k] ? `<tr><td>${label}</td><td>${h.stats[k][0]}</td><td>+${h.stats[k][1].toFixed(2)}</td>
              <td>${valueAt(h, k, 20).toFixed(1)}</td><td>${valueAt(h, k, 40).toFixed(1)}</td><td>${valueAt(h, k, 50).toFixed(1)}</td></tr>` : "").join("")}
            <tr><td><b>合計</b></td><td><b>${totalAt(h, 1)}</b></td><td></td><td>${totalAt(h, 20).toFixed(1)}</td><td>${totalAt(h, 40).toFixed(1)}</td><td><b>${totalAt(h, 50).toFixed(1)}</b></td></tr>
          </tbody>
        </table>` : h.lv50 ? `
        <table class="mini">
          <thead><tr><th>属性</th><th>Lv50</th></tr></thead>
          <tbody>
            ${STATS.map(([k, label]) => `<tr><td>${label}</td><td>${h.lv50[k]}</td></tr>`).join("")}
            <tr><td><b>合計</b></td><td><b>${totalAt(h, 50)}</b></td></tr>
          </tbody>
        </table>
        <p class="muted small">Lv1の値と成長値は未収録のため、Lv50の値のみ表示しています。</p>` : `<p class="muted small">ステータスは未収録です。</p>`}
      </section>
      <section>
        <h3>固有戦法：${esc(h.uniqueSkill)}</h3>
        ${(adjustments[h.uniqueSkill] || []).map((a) => `<a class="adjust" href="news.html#${a.id}" style="margin-bottom:6px">⚠ ${esc(a.date)} のメンテナンス：${esc(a.text.split("\n")[0].replace(/^[・•]\s*/, ""))}</a>`).join("")}
        ${s ? `
          <div class="tags" style="justify-content:flex-start;margin:0 0 6px">
            <span class="tag kind">${esc(s.kind)}</span>
            ${s.rate ? `<span class="tag rate">発動 ${esc(s.rate)}${s.rateUnsure ? "?" : ""}</span>` : ""}
            ${s.effectTypes.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}
            <span class="tag src">${esc(s.target)}</span>
          </div>
          <div class="tdesc">${esc(s.desc)}</div>
          ${s.troops.length < 5 ? `<p class="small muted">兵種制限：${esc(s.troops.join("・"))}のみ</p>` : ""}` : ""}
      </section>
      ${recommendSection(h)}
      ${h.traits.length ? `
      <section>
        <h3>武将特性（凸別）</h3>
        ${h.traits.map((t) => `<div class="trait"><span class="rk">${esc(t.rank)}</span><div><b>${esc(t.name)}</b><p>${esc(t.effect)}</p></div></div>`).join("")}
      </section>` : ""}
    </div>`;
  dlg.querySelector(".dlg-close").onclick = () => dlg.close();
  dlg.showModal();
}
$("#dlg").addEventListener("click", (e) => { if (e.target.id === "dlg") e.target.close(); });

function recommendSection(h) {
  const r = recommendFor(h.name);
  if (!r.uses.length && !r.notes.length) return "";
  const src = (id) => sources.get(id);
  const srcLink = (id) => `<a href="news.html#${id}">出典：公式「${esc(src(id)?.title || "")}」（${esc(src(id)?.date || "")}）</a>`;
  const or = (list) => L(list).map(tacticLink).join(" / ");
  return `
    <section>
      <h3>相性の良い戦法（公式の解説・おすすめ編制より）</h3>
      ${r.notes.map((n) => `
        <div class="rec-note">
          <div class="small muted">公式の推奨戦法</div>
          <div class="rec-top">${n.推奨.map((t) => `<span class="rec-item">${tacticLink(t)}</span>`).join("")}</div>
          ${n.評価 ? `<p class="small" style="margin:6px 0 0"><span class="tag kind">評価</span> ${esc(n.評価)}</p>` : ""}
          <p class="small" style="margin:4px 0 0">${srcLink(n.出典)}</p>
        </div>`).join("")}
      ${r.uses.length ? `
      <div class="small muted" style="margin-top:8px">おすすめ編制での採用回数</div>
      <div class="rec-top">${r.top.map(([t, n]) => `<span class="rec-item">${tacticLink(t)}${n > 1 ? `<i>×${n}</i>` : ""}</span>`).join("")}</div>
      ${r.alt.length ? `<p class="small muted" style="margin:6px 0 0">代わりのA戦法：${r.alt.map(([t]) => tacticLink(t)).join("、")}</p>` : ""}
      <details class="rec-detail">
        <summary>採用されている編制（${r.uses.length}件）</summary>
        ${r.uses.map(({ f, m, mates }) => `
          <div class="rec-card">
            <div class="rec-head"><b>${esc(f.名前)}</b>${m.役割 ? `<span class="tag">${esc(m.役割)}</span>` : ""}${f.案 ? `<span class="small muted">${esc(f.案)}</span>` : ""}${f.コスト ? `<span class="small muted">コスト${esc(f.コスト)}</span>` : ""}</div>
            <table class="mini rec-table"><tbody>
              ${m.第一 || m.第二 ? `
              <tr><th>第一戦法</th><td>${or(m.第一) || "—"}${L(m.代替第一).length ? `<span class="small muted">（代わり：${or(m.代替第一)}）</span>` : ""}</td></tr>
              <tr><th>第二戦法</th><td>${or(m.第二) || "—"}${L(m.代替第二).length ? `<span class="small muted">（代わり：${or(m.代替第二)}）</span>` : ""}</td></tr>` : ""}
              ${m.推奨 ? `<tr><th>推奨戦法</th><td>${m.推奨.map(tacticLink).join(" ")}</td></tr>` : ""}
              ${m.属性 ? `<tr><th>属性配分</th><td>${esc(m.属性)}</td></tr>` : ""}
              ${m.兵学 ? `<tr><th>兵学</th><td>${esc(m.兵学)}</td></tr>` : ""}
              ${m.兵装 ? `<tr><th>兵装</th><td>${esc(m.兵装)}</td></tr>` : ""}
              <tr><th>一緒に組む</th><td>${mates.map(esc).join("・")}</td></tr>
            </tbody></table>
            ${f.方針 ? `<p class="small" style="margin:4px 0 0">${esc(f.方針)}</p>` : ""}
            ${f.備考 ? `<p class="small muted" style="margin:4px 0 0">${esc(f.備考)}</p>` : ""}
            <p class="small" style="margin:4px 0 0">${srcLink(f.出典)}</p>
          </div>`).join("")}
      </details>` : ""}
    </section>`;
}

const initialQ = new URLSearchParams(location.search).get("q");
if (initialQ) {
  $("#q").value = initialQ;
  render();
  const exact = heroes.find((h) => h.name === initialQ);
  if (exact) openDetail(exact);
} else {
  render();
}
</script>
</body>
</html>
